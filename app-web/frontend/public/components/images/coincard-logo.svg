<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 56" width="344" height="56" shape-rendering="crispEdges" aria-label="¢oincard">

  <title>¢oincard — ImplicitEx</title>
  <desc>¢oincard logotype. Block Type System. Lowercase pixel forms.</desc>

  <!--
    Grid: 8×8 px blocks
    x-height: 5 rows = 40px, y=8 to y=48
    ¢ body = c body + stubs at y=0–8 and y=48–56 (center col only)
    d right stem ascends to y=0
    i: 1-col stem, 1-block gap each side
  -->

  <!-- ¢ (x=0–40) — identical body to c, plus stubs above and below at col 2 -->
  <path fill="currentColor" d="
    M 16,0 H 24 V 8 H 16 Z
    M 0,8 H 40 V 16 H 0 Z
    M 0,16 H 8 V 40 H 0 Z
    M 32,16 H 40 V 24 H 32 Z
    M 32,32 H 40 V 40 H 32 Z
    M 0,40 H 40 V 48 H 0 Z
    M 16,48 H 24 V 56 H 16 Z
  "/>

  <!-- o (x=48–88) — open rectangle -->
  <path fill="currentColor" d="
    M 48,8 H 88 V 16 H 48 Z
    M 48,16 H 56 V 40 H 48 Z
    M 80,16 H 88 V 40 H 80 Z
    M 48,40 H 88 V 48 H 48 Z
  "/>

  <!-- i (x=96) — 1-col stem, tight spacing -->
  <path fill="currentColor" d="
    M 96,8 H 104 V 48 H 96 Z
  "/>

  <!-- n (x=112–152) — 5 cols wide, arch + two legs at col 0 and col 4 -->
  <path fill="currentColor" d="
    M 112,8 H 152 V 16 H 112 Z
    M 112,16 H 120 V 48 H 112 Z
    M 144,16 H 152 V 48 H 144 Z
  "/>

  <!-- c (x=160–200) — C with interior corner blocks at top-right and bottom-right -->
  <path fill="currentColor" d="
    M 160,8 H 200 V 16 H 160 Z
    M 160,16 H 168 V 40 H 160 Z
    M 192,16 H 200 V 24 H 192 Z
    M 192,32 H 200 V 40 H 192 Z
    M 160,40 H 200 V 48 H 160 Z
  "/>

  <!-- a (x=208–248) — double-story: 5×5 grid
       Row 1: all cols (top bar)
       Row 2: col 5 only (upper bowl open on left)
       Row 3: all cols (mid divider)
       Row 4: col 1 + col 5 (lower bowl walls)
       Row 5: all cols (bottom bar) -->
  <path fill="currentColor" d="
    M 208,8 H 248 V 16 H 208 Z
    M 240,8 H 248 V 48 H 240 Z
    M 208,24 H 248 V 32 H 208 Z
    M 208,32 H 216 V 40 H 208 Z
    M 208,40 H 248 V 48 H 208 Z
  "/>

  <!-- r (x=256–296) — arch top 4 cols, left leg full height, right ear row 1 only -->
  <path fill="currentColor" d="
    M 256,8 H 288 V 16 H 256 Z
    M 256,16 H 264 V 48 H 256 Z
    M 288,16 H 296 V 24 H 288 Z
  "/>

  <!-- d (x=304–344) — bowl: top cols 1–3, left col 0 y=16–40, bottom cols 1–3.
       Right stem col 4 ascends to y=0.
       Compare to a: col 0 empty at y=8–16 (where a fills it as inward turn) -->
  <path fill="currentColor" d="
    M 312,8 H 336 V 16 H 312 Z
    M 304,16 H 312 V 40 H 304 Z
    M 336,0 H 344 V 48 H 336 Z
    M 312,40 H 336 V 48 H 312 Z
  "/>

</svg>
