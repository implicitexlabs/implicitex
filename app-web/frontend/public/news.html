  <script>
  (function () {
    'use strict';
    if (!window.IX_NEWS || !IX_NEWS.length) return;

    /* Newest article first */
    var articles = IX_NEWS.slice().reverse();

    /* Update the "last updated" dateline to the most recent article */
    var subhead = document.getElementById('newsSubhead');
    if (subhead) subhead.textContent = 'Last updated: ' + articles[0].date;

    /* Render all articles */
    var container = document.getElementById('newsArticles');
    if (!container) return;

    container.innerHTML = articles.map(function (a) {
      var bodyHtml = a.body.map(function (p) {
        return '<p>' + p + '</p>';
      }).join('');
      return '<article class="news-article" id="' + a.id + '">' +
        '<p class="updated" style="margin-bottom:0.5rem">' +
          '<time datetime="' + a.dateIso + '">' + a.date + '</time>' +
          ' &nbsp;&middot;&nbsp; ' + a.category +
        '</p>' +
        '<h2>' + a.title + '</h2>' +
        bodyHtml +
        '</article>';
    }).join('');

    /* Scroll to the anchor from the URL hash if present */
    if (location.hash) {
      var target = document.querySelector(location.hash);
      if (target) {
        setTimeout(function () { target.scrollIntoView({ behavior: 'smooth' }); }, 80);
      }
    }
  }());
  </script>
