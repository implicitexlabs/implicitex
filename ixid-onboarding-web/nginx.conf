server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-Control: no-store on all responses.
    # This service is an authentication-facing surface; no response may be cached.
    add_header Cache-Control "no-store" always;

    # Referrer-Policy: no-referrer on all responses.
    # The /auth/action page receives an oobCode in the URL query string.
    # Applied globally so no referrer header is ever sent from this origin.
    add_header Referrer-Policy "no-referrer" always;

    # Registration and all other app routes → index.html (single-page app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Email action handler — explicit route, not caught by the SPA fallback.
    # Serves action.html which handles mode=verifyEmail and mode=resetPassword.
    # oobCode is a URL query parameter; must not cache or leak via referrer.
    location = /auth/action {
        try_files /action.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Static assets — no-store; versioning deferred to Slice E/F.
    # Both headers are repeated explicitly here. nginx drops all inherited
    # server-level add_header directives the moment a location block defines
    # any add_header of its own. Repeating both headers maintains the declared
    # global invariant: every response from this service carries no-store and
    # no-referrer regardless of which location matches.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Health check endpoint for Load Balancer health probes.
    # default_type sets the Content-Type for the return directive response.
    # add_header Content-Type would append a second header alongside nginx's
    # automatic application/octet-stream type — producing duplicate headers.
    # Headers repeated explicitly for the same nginx inheritance reason as above.
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
