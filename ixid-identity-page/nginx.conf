server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-Control: no-store on the identity page itself.
    # The page content is static but the identity it displays is time-sensitive;
    # serving a cached page risks showing a stale loading state.
    add_header Cache-Control "no-store" always;

    # HTML files at known paths (about, help, privacy, terms) are served directly.
    # Extensionless URLs (/privacy → privacy.html) are resolved by the $uri.html step.
    # Unknown paths fall to index.html (IX ID identity page, derived from hostname).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Static assets may be cached by content hash if versioned in future.
    # For v0.1 all assets are served no-store with the page.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Health check endpoint for Load Balancer health probes
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
